trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  imageName: smart-hospital-api

stages:
  - stage: Build
    jobs:
      - job: Api
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.x

          - script: dotnet restore SmartHospital.Api/SmartHospital.Api.csproj
            displayName: Restore API

          - script: dotnet build SmartHospital.Api/SmartHospital.Api.csproj --configuration $(buildConfiguration) --no-restore
            displayName: Build API

          - script: dotnet publish SmartHospital.Api/SmartHospital.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build
            displayName: Publish API

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api

      - job: Frontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: 20.x

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: Build React frontend

          - publish: frontend/dist
            artifact: frontend

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: AzureWebApp
        environment: smart-hospital-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploy API artifact to Azure App Service or Azure Container Apps."
                  displayName: Deployment placeholder
