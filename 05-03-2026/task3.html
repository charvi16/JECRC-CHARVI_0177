<!-- Secure Banking App Right Click Disable
Scenario:
A banking application disables right-click to protect sensitive information.

Requirement

Use contextmenu

Prevent default behavior

document.addEventListener("contextmenu", function(e){

e.preventDefault();

console.warn("Right click disabled for security");

}); -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Banking App</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef3f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
    width:350px;
}

h2{
    color:#1a3d6d;
}

p{
    color:#555;
}

.security{
    margin-top:20px;
    padding:10px;
    background:#f5f7fa;
    border-radius:5px;
    font-size:14px;
    color:#333;
}
</style>
</head>

<body>

<div class="container">
<h2>Secure Banking Portal</h2>
<p>Your information is protected.</p>

<div class="security">
Right click has been disabled for security purposes.
</div>
</div>

<script>

document.addEventListener("contextmenu", function(e){

    // Prevent default right-click menu
    e.preventDefault();

    console.warn("Right click disabled for security");

});

</script>

</body>
</html>
