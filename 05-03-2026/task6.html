<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Login Activity Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #log {
            margin-top: 20px;
            font-size: 14px;
            color: green;
            min-height: 20px;
        }
    </style>
</head>


<body>

<div class="container">

    <h2>User Login</h2>

    <input id="username" placeholder="Enter Username">

    <br>

    <button onclick="login()">Login</button>

    <div id="log"></div>

</div>


<script>

const logger = {

    log: function(level, message, data) {

        const logEntry = {
            level: level,
            message: message,
            data: data,
            time: new Date().toISOString()
        };

        console.log("Sending log to server:", logEntry);

        // Simulated remote logging
        fetch("https://example.com/log", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(logEntry)
        }).catch(() => {
            console.log("Simulated server logging (no real server connected)");
        });

        document.getElementById("log").innerHTML =
            "Log Sent: " + message + " (" + data.username + ")";
    }

};


function login() {

    const user = document.getElementById("username").value;

    if(user.trim() === ""){
        alert("Please enter username");
        return;
    }

    logger.log("INFO", "User Login Attempt", { username: user });

}

</script>

</body>
</html>
