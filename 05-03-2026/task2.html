<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Form - Enter Key Event</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:8px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    width:300px;
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="login-box">
<h2>Login</h2>

<input type="text" id="username" placeholder="Enter username">
<button onclick="login()">Login</button>

</div>

<script>

function login(){
    console.log("Login attempt triggered");
    alert("Submitting login form");
}

document.getElementById("username").addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
