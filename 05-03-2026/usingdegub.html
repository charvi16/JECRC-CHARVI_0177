<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug</title>
</head>
<style>
    body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .log { background-color: #4e73df; color: white; }
        .info { background-color: #36b9cc; color: white; }
        .warn { background-color: #f6c23e; color: black; }
        .error { background-color: #e74a3b; color: white; }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .instruction {
            margin-top: 30px;
            font-size: 18px;
        }

</style>
<body>
    <div class="container">
        <h1>JS Console Methods Demo</h1>
        <button class="log" onclick="basicLog()">Log</button>
        <button class="info" onclick="infoMessage()">Information</button>
        <button class="warn" onclick="warningMessage()">Warn</button>
        <button class="error" onclick="errorMessage()">Error</button>


        <div class="instruction">
            Open Developer Tools (Press F12 -> Console) to see output
        </div>
    </div>
</body>
<script>
    function basicLog(){
        console.log("Basic Logging");
    }

    function infoMessage(){
        console.info("Information Message");
    }

    function warningMessage(){
        console.warn("warning message");
    }

    function errorMessage(){
        console.error("Error message");
    }
</script>
</html>
