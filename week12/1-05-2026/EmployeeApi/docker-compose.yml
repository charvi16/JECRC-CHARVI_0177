version: '3.9'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: EMPSystem
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  employee-api:
    build: .
    container_name: employee-api
    depends_on:
      - mysql-db
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

volumes:
  mysql_data: