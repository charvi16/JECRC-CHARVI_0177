<div class="page">

  <h1 class="title">Transactions Dashboard</h1>

  <!-- FILTER CARD -->
  <div class="card controls">
    <div class="controls-left">
      <input type="date" [(ngModel)]="selectedDate" />
      <button class="btn primary" (click)="filter()">Filter</button>
      <button class="btn secondary" (click)="reset()">Reset</button>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="card form-card">
    <h3>Add Transaction</h3>

    <div class="form">
      <input type="date" [(ngModel)]="newTransaction.date" />

      <input type="text" placeholder="Description"
             [(ngModel)]="newTransaction.description" />

      <select [(ngModel)]="newTransaction.type">
        <option [value]="0">Credit</option>
        <option [value]="1">Debit</option>
      </select>

      <input type="number" placeholder="Amount"
             [(ngModel)]="newTransaction.amount" />

      <input type="text" placeholder="Balance ($...)"
             [(ngModel)]="newTransaction.balance" />

      <button class="btn primary" (click)="createTransaction()">+ Add</button>
    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="card table-card">
    <h3>Transactions</h3>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Type</th>
          <th (click)="sortByAmount()" class="sortable">
            Amount ($) ⬍
          </th>
          <th>Balance</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of transactions" class="row">
          <td>{{ t.date }}</td>
          <td class="desc">{{ t.description }}</td>

          <td>
            <span class="tag"
                  [class.credit]="t.type === 0"
                  [class.debit]="t.type === 1">
              {{ t.type === 0 ? 'Credit' : 'Debit' }}
            </span>
          </td>

          <td class="amount">{{ t.amount | number:'1.2-2' }}</td>
          <td class="balance">{{ t.balance }}</td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
