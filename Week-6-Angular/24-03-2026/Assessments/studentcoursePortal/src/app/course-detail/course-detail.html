<div class="detail-container" *ngIf="course">

  <div class="left">
    <div class="image">📘</div>
  </div>

  <div class="right">
    <h2>{{course.CourseName}}</h2>

    <p>{{course.Desc}}</p>

    <p class="seats">Seats Available: {{course.seatsVailable}}</p>

    <button 
      class="buy-btn" 
      (click)="enroll()"
      [disabled]="course.seatsVailable === 0">
      Enroll Now
    </button>

    <p class="msg">{{message}}</p>
  </div>

</div>
