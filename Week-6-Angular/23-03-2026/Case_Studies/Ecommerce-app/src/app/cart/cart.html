<div class="cart-container">

  <h2>My Cart</h2>

  <div *ngFor="let item of cartItems">

    <div class="cart-item">
      <div>
        <h4>{{item.name}}</h4>
        <p>₹ {{item.price}}</p>
      </div>

      <div class="quantity">
        <button class="qty-btn" (click)="decrease(item.productID)">-</button>
        {{item.quantity}}
        <button class="qty-btn" (click)="increase(item.productID)">+</button>
      </div>

      <button class="remove-btn" (click)="remove(item.productID)">
        Remove
      </button>
    </div>

  </div>

  <div class="total">
    Total: ₹ {{total}}
  </div>

</div>
