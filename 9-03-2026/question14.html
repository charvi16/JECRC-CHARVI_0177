<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Character Counter</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

textarea{
    width:300px;
    height:120px;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    resize:none;
}

#count{
    margin-top:10px;
    font-size:18px;
    color:#333;
}
</style>
</head>

<body>

<div class="container">

<h2>Live Character Counter</h2>

<textarea id="message" placeholder="Type something..."></textarea>

<p id="count">Characters: 0</p>

</div>

<script>

document.getElementById("message").addEventListener("keyup", (e) => {

    let length = e.target.value.length;

    document.getElementById("count").innerText = "Characters: " + length;

});

</script>

</body>
</html>
